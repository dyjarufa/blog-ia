services:
  postgres:
    image: postgres:alpine
    container_name: blog-ia-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_ia
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
